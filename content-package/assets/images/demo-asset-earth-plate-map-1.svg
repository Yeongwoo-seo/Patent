<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="테스트용 가상 판 경계 지도">
  <title>테스트용 가상 자료 - 실제 지도/좌표 아님</title>
  <rect x="0" y="0" width="320" height="200" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="10" y="20" width="140" height="160" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="170" y="20" width="140" height="160" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <line x1="160" y1="20" x2="160" y2="180" stroke="#0f172a" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M155,100 L120,100" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowL)"/>
  <path d="M165,100 L200,100" stroke="#b91c1c" stroke-width="4" marker-end="url(#arrowR)"/>
  <defs>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b91c1c"/>
    </marker>
  </defs>
  <text x="160" y="195" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#64748b">두 판이 서로 멀어지는 방향으로 이동 (synthetic)</text>
</svg>
